# Sprite list.
#
# Each sprite needs an `id`, a `name`, a `season` and a list of `variants`.
# The season dropdown is built from the `season` values, newest last in this file
# (it lists them newest first).
# Image files are found automatically from the variant name:
#   Classic  -> images/<file>.png
#   Other    -> images/<variant>_<file>.png   (e.g. images/holofoil_water.png)
# `file` defaults to the sprite id; set it only when the image name differs.
#
# To add a new sprite: drop its images in images/ and add an entry below.
# To add a new variant (e.g. "Holofoil"): add it to the sprite's variants list.
# Run `node tools/check-sprites.mjs` to find images that aren't listed yet.
#
# Do not rename an existing `id` - saved progress is keyed on it.

